<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Terminal: whoami – Lars Stimpel, Data Engineering &amp; DevOps">
<defs>
  <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#7ee787"/><stop offset=".5" stop-color="#79c0ff"/><stop offset="1" stop-color="#d2a8ff"/>
  </linearGradient>
  <linearGradient id="gb" x1="0" x2="1">
    <stop offset="0" stop-color="#7ee787"/><stop offset=".5" stop-color="#79c0ff"/><stop offset="1" stop-color="#d2a8ff"/>
  </linearGradient>
  <radialGradient id="glow" cx=".85" cy=".1" r=".6">
    <stop offset="0" stop-color="#79c0ff" stop-opacity=".16"/><stop offset="1" stop-color="#79c0ff" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#30363d" stroke-opacity=".35" stroke-width="1"/>
  </pattern>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:15px}
.prompt{fill:#7ee787;font-weight:700}
.cmd{fill:#e6edf3}
.out{fill:#8b949e}
.name{font-size:46px;font-weight:800;fill:url(#gb);letter-spacing:-1px}
.role{fill:#c9d1d9;font-size:16px}
.title{fill:#8b949e;font-size:12px}
.cur{fill:#79c0ff}
.border{animation:hue 8s linear infinite}
@keyframes show{to{opacity:1}}
@keyframes hide{to{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes hue{to{stroke-dashoffset:-400}}
.a0p{opacity:0;animation:show 0s 0.40s forwards}
.cov0{animation:type0 0.39s steps(6) 0.40s forwards,hide 0s 0.79s forwards}@keyframes type0{to{transform:translateX(54.0px)}}
.cur0{opacity:0;animation:type0c 0.39s steps(6) 0.40s forwards,vis0 0.74s step-end 0.40s forwards}@keyframes type0c{to{transform:translateX(54.0px)}}@keyframes vis0{0%{opacity:1}100%{opacity:0}}
.n1{opacity:0;animation:rise .7s ease-out 1.14s forwards}
.a2p{opacity:0;animation:show 0s 1.94s forwards}
.cov2{animation:type2 1.10s steps(17) 1.94s forwards,hide 0s 3.04s forwards}@keyframes type2{to{transform:translateX(153.0px)}}
.cur2{opacity:0;animation:type2c 1.10s steps(17) 1.94s forwards,vis2 1.45s step-end 1.94s forwards}@keyframes type2c{to{transform:translateX(153.0px)}}@keyframes vis2{0%{opacity:1}100%{opacity:0}}
.o3{opacity:0;animation:rise .5s ease-out 3.40s forwards}
.a4p{opacity:0;animation:show 0s 4.00s forwards}
.cov4{animation:type4 1.24s steps(19) 4.00s forwards,hide 0s 5.23s forwards}@keyframes type4{to{transform:translateX(171.0px)}}
.cur4{opacity:0;animation:type4c 1.24s steps(19) 4.00s forwards,vis4 1.58s step-end 4.00s forwards}@keyframes type4c{to{transform:translateX(171.0px)}}@keyframes vis4{0%{opacity:1}100%{opacity:0}}
.o5{opacity:0;animation:rise .5s ease-out 5.58s forwards}
.fin{opacity:0;animation:show 0s 6.18s forwards}.finc{animation:show 0s 6.18s forwards,blink 1s step-end 6.18s infinite}
</style>
<rect x="1.5" y="1.5" width="877" height="357" rx="14" fill="#0d1117"/>
<rect x="1.5" y="1.5" width="877" height="357" rx="14" fill="url(#grid)"/>
<rect x="1.5" y="1.5" width="877" height="357" rx="14" fill="url(#glow)"/>
<rect x="1.5" y="1.5" width="877" height="357" rx="14" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="300 100" class="border"/>
<circle cx="28" cy="26" r="6" fill="#ff5f57"/><circle cx="48" cy="26" r="6" fill="#febc2e"/><circle cx="68" cy="26" r="6" fill="#28c840"/>
<text x="440.0" y="30" text-anchor="middle" class="title">lars@github: ~/larsskrachen</text>
<line x1="1.5" x2="878.5" y1="48" y2="48" stroke="#30363d"/>
<text x="44" y="96" class="prompt a0p">❯</text>
<text x="62.0" y="96" class="cmd" textLength="54.0" lengthAdjust="spacingAndGlyphs">whoami</text>
<rect x="62.0" y="81" width="56.0" height="21" fill="#0d1117" class="cov0"/>
<rect x="62.0" y="83" width="9.0" height="17" class="cur cur0"/>
<text x="44" y="140" class="name n1">Lars Stimpel</text>
<text x="378" y="134" class="role n1">Data Engineering &amp; DevOps</text>
<text x="44" y="196" class="prompt a2p">❯</text>
<text x="62.0" y="196" class="cmd" textLength="153.0" lengthAdjust="spacingAndGlyphs">cat ./mission.txt</text>
<rect x="62.0" y="181" width="155.0" height="21" fill="#0d1117" class="cov2"/>
<rect x="62.0" y="183" width="9.0" height="17" class="cur cur2"/>
<text x="44" y="222" class="out o3">Ich baue Datenpipelines und die Infrastruktur, auf der sie laufen.</text>
<text x="44" y="268" class="prompt a4p">❯</text>
<text x="62.0" y="268" class="cmd" textLength="171.0" lengthAdjust="spacingAndGlyphs">echo $JOB $LOCATION</text>
<rect x="62.0" y="253" width="173.0" height="21" fill="#0d1117" class="cov4"/>
<rect x="62.0" y="255" width="9.0" height="17" class="cur cur4"/>
<text x="44" y="294" class="out o5">Data &amp; DevOps Engineer Consultant @ RedArcs Consulting  ·  Ingolstadt/München</text>
<text x="44" y="334" class="prompt fin">❯</text>
<rect x="62.0" y="321" width="9.0" height="17" class="cur fin finc"/>
</svg>
